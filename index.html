<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>V-MAX System</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: sans-serif;
        }
        body {
            display: flex;
            flex-direction: column;
            height: 100vh;
            background: #0f172a;
            color: #f8fafc;
        }
        header {
            background: #1e293b;
            padding: 15px;
            text-align: center;
            font-weight: bold;
            border-bottom: 1px solid #334155;
        }
        #app {
            display: flex;
            flex-direction: column;
            flex: 1;
            max-width: 800px;
            width: 100%;
            margin: 0 auto;
            background: #1e293b;
            overflow: hidden;
        }
        #chat-box {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .message {
            max-width: 80%;
            padding: 10px 15px;
            border-radius: 12px;
            word-wrap: break-word;
        }
        .message.received {
            background: #334155;
            align-self: flex-start;
            border-bottom-right-radius: 2px;
        }
        .message.sent {
            background: #2563eb;
            color: #ffffff;
            align-self: flex-end;
            border-bottom-left-radius: 2px;
        }
        footer {
            display: flex;
            flex-direction: column;
            padding: 10px;
            background: #0f172a;
            gap: 10px;
            border-top: 1px solid #334155;
        }
        .input-row {
            display: flex;
            gap: 10px;
        }
        input[type="text"] {
            flex: 1;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #334155;
            background: #1e293b;
            color: #fff;
            outline: none;
        }
        button {
            padding: 10px 15px;
            border-radius: 8px;
            border: none;
            background: #2563eb;
            color: #fff;
            font-weight: bold;
            cursor: pointer;
        }
        button:hover {
            background: #1d4ed8;
        }
        .upload-box {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .file-label {
            background: #334155;
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
        }
        input[type="file"] {
            display: none;
        }
        #file-list {
            font-size: 12px;
            color: #94a3b8;
        }
    </style>
</head>
<body>

    <div id="app">
        <header id="main-header">نظام V-MAX لإدارة البيانات</header>
        
        <div id="chat-box">
            <div class="message received" id="welcome-msg">مرحباً بك في نظام V-MAX. كيف يمكنني مساعدتك اليوم؟</div>
        </div>

        <footer>
            <div class="upload-box">
                <label for="file-input" class="file-label" id="upload-label">اختر الصور أو الملفات</label>
                <input type="file" id="file-input" multiple onchange="handleFiles(this.files)">
                <span id="file-list">لم يتم اختيار أي ملف</span>
            </div>
            <div class="input-row">
                <input type="text" id="message-input" placeholder="اكتب رسالتك هنا...">
                <button onclick="sendMessage()" id="send-btn">إرسال</button>
            </div>
            <button onclick="sendData()" id="action-btn" style="background: #10b981;">إرسال البيانات</button>
        </footer>
    </div>

    <script>
        let currentLang = 'ar';
[16/09/2026 01:44 ص] Ahmad Me See😘: function sendMessage() {
            const input = document.getElementById('message-input');
            const messageText = input.value.trim();
            
            if (messageText !== '') {
                const chatBox = document.getElementById('chat-box');
                const messageDiv = document.createElement('div');
                messageDiv.className = 'message sent';
                messageDiv.textContent = messageText;
                chatBox.appendChild(messageDiv);
                
                input.value = '';
                chatBox.scrollTop = chatBox.scrollHeight;
            }
        }

        function handleFiles(files) {
            const fileList = document.getElementById('file-list');
            if (files.length > 0) {
                let names = Array.from(files).map(f => f.name).join(', ');
                fileList.textContent = names;
            } else {
                fileList.textContent = 'لم يتم اختيار أي ملف';
            }
        }

        function sendData() {
            alert('تم إرسال البيانات بنجاح!');
        }
    </script>
</body>
</html>
